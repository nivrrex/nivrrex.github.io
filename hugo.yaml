baseURL: "https://nivrrex.github.io/"
title: "Nivrrex's blog"
theme: "PaperMod"

paginate: 10
languageCode: zh-cn
hasCJKLanguage: true

params:
  env: production
  description: "Nivrrex's blog"
  author: "nivrrex"

  homeInfoParams:
    Title: "你好 👋"
    Content: >
      欢迎来到 nivrrex 的 blog 空间，本 blog 将记录我在 GitHub 和生活中的点点滴滴。

  # 关键：首页显示文章列表及摘要
  showFullContents: false
  displayFullPostContent: true

  # 样式配置
  defaultTheme: light # 强制明亮模式，若需跟随系统则设为 auto
  disableThemeToggle: false # 是否显示深色模式切换按钮

  # 列表页显示评论数、阅读时间等
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true

menu:
  main:
    - name: 归档
      url: archives
      weight: 10
    - name: 标签
      url: tags
      weight: 20
